<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAE-France Economic Monitor</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-uae">UAE</span><span class="logo-sep">&mdash;</span><span class="logo-fr">France</span>
            </div>
            <h1>Economic Monitor</h1>
        </div>
        <div class="header-right">
            <div class="digest-info">
                <span class="digest-label">Last update:</span>
                <span id="digest-time" class="digest-time">Loading...</span>
            </div>
            <div class="digest-stats">
                <span id="total-articles" class="stat-badge">--</span> articles
                <span id="total-sources" class="stat-badge">--</span> sources
            </div>
        </div>
    </header>

    <nav class="toolbar">
        <div class="toolbar-left">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="search-input" placeholder="Search articles..." autocomplete="off">
            </div>
            <select id="source-filter" class="filter-select">
                <option value="all">All sources</option>
                <option value="french">French sources</option>
                <option value="uae">UAE sources</option>
                <option value="international">International</option>
            </select>
            <select id="digest-select" class="filter-select">
                <option value="latest">Latest digest</option>
            </select>
        </div>
        <div class="toolbar-right">
            <button id="btn-starred" class="btn btn-outline" title="Show starred articles">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                </svg>
                <span id="starred-count">0</span>
            </button>
            <button id="btn-export" class="btn btn-outline" title="Export current view">
                Export CSV
            </button>
        </div>
    </nav>

    <div class="sector-tabs" id="sector-tabs">
        <button class="sector-tab active" data-sector="all">
            All <span class="tab-count" id="count-all">--</span>
        </button>
        <button class="sector-tab" data-sector="energy">
            Energy <span class="tab-count" id="count-energy">--</span>
        </button>
        <button class="sector-tab" data-sector="ai_tech">
            AI & Tech <span class="tab-count" id="count-ai_tech">--</span>
        </button>
        <button class="sector-tab" data-sector="climate">
            Climate <span class="tab-count" id="count-climate">--</span>
        </button>
        <button class="sector-tab" data-sector="food_security">
            Food Security <span class="tab-count" id="count-food_security">--</span>
        </button>
        <button class="sector-tab" data-sector="logistics">
            Logistics <span class="tab-count" id="count-logistics">--</span>
        </button>
        <button class="sector-tab" data-sector="aeronautics">
            Aeronautics <span class="tab-count" id="count-aeronautics">--</span>
        </button>
        <button class="sector-tab" data-sector="space">
            Space <span class="tab-count" id="count-space">--</span>
        </button>
        <button class="sector-tab" data-sector="fintech">
            Fintech <span class="tab-count" id="count-fintech">--</span>
        </button>
        <button class="sector-tab" data-sector="health">
            Health <span class="tab-count" id="count-health">--</span>
        </button>
    </div>

    <main class="content">
        <div id="articles-container" class="articles-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading digest...</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <p>UAE-France Economic Monitor &mdash; Automated intelligence digest</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
